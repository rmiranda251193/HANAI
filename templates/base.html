{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="DodongOS Physics AI educational platform">
    <title>{% block title %}DodongOS Physics AI{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <a class="brand" href="{% url 'home' %}">
          <span class="brand-mark" aria-hidden="true">◉</span>
          <span>DodongOS <strong>Physics AI</strong></span>
        </a>
        <nav class="navigation">
          <a class="nav-link is-active" href="{% url 'home' %}">Overview</a>
          <span class="nav-link is-disabled">Teacher workspace <small>soon</small></span>
          <span class="nav-link is-disabled">Physics resources <small>soon</small></span>
        </nav>
        <p class="sidebar-status"><span></span> Foundation mode</p>
      </aside>
      <main class="content">
        <header class="topbar">
          <p class="eyebrow">Scientific learning workspace</p>
          <p class="mode">Local development</p>
        </header>
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
